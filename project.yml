# Generated into PilgrimAtlas.xcodeproj by XcodeGen during macOS CI.
# xtool still builds the phone from Package.swift. This project compiles the
# same sources as one app module so `package` types stay visible without a
# second library target.
name: PilgrimAtlas
options:
  bundleIdPrefix: com.lojo
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: 6.10.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    # Same package name as Package.swift, so `package` types stay visible to
    # @Observable in this Xcode module. Without it they compile as fileprivate.
    OTHER_SWIFT_FLAGS: "$(inherited) -package-name PilgrimAtlas"

targets:
  PilgrimAtlas:
    type: application
    platform: iOS
    sources:
      - path: Sources/PilgrimAtlas
        excludes:
          - Resources
      - path: Sources/PilgrimAtlasCore
        excludes:
          - "*.json"
          - "*.txt"
      - path: Sources/PilgrimAtlas/Resources
        buildPhase: resources
        excludes:
          - glyphs
          - glyphs/**
      - path: Sources/PilgrimAtlas/Resources/glyphs
        buildPhase: resources
        type: folder
      - path: Sources/PilgrimAtlasCore/sentences.json
        buildPhase: resources
      - path: Sources/PilgrimAtlasCore/render-contract.json
        buildPhase: resources
      - path: Sources/PilgrimAtlasCore/cabq_disclaimer.txt
        buildPhase: resources
      - path: Sources/PilgrimAtlasCore/slo_disclaimer.txt
        buildPhase: resources
      - path: Assets.xcassets
    dependencies:
      - package: MapLibre
        product: MapLibre
      - sdk: libc++.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lojo.PilgrimAtlas
        PRODUCT_NAME: PilgrimAtlas
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
        ENABLE_TESTABILITY: YES
        OTHER_LDFLAGS: "$(inherited) -lsqlite3"

  PilgrimAtlasTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/PilgrimAtlasCoreTests
        excludes:
          - Fixtures
      - path: Sources/PilgrimAtlasCore
        excludes:
          - "*.json"
          - "*.txt"
      - path: Tests/PilgrimAtlasCoreTests/Fixtures
        buildPhase: resources
      - path: Sources/PilgrimAtlasCore/sentences.json
        buildPhase: resources
      - path: Sources/PilgrimAtlasCore/render-contract.json
        buildPhase: resources
      - path: Sources/PilgrimAtlasCore/cabq_disclaimer.txt
        buildPhase: resources
      - path: Sources/PilgrimAtlasCore/slo_disclaimer.txt
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lojo.PilgrimAtlas.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: ""
        BUNDLE_LOADER: ""

  PilgrimAtlasUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/PilgrimAtlasUITests
    dependencies:
      - target: PilgrimAtlas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lojo.PilgrimAtlas.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PilgrimAtlas

schemes:
  PilgrimAtlas:
    build:
      targets:
        PilgrimAtlas: all
    run:
      config: Debug
    archive:
      config: Release
      customArchiveName: PilgrimAtlas
  PilgrimAtlasTests:
    build:
      targets:
        PilgrimAtlasTests: [test]
    test:
      config: Debug
      targets:
        - PilgrimAtlasTests
  PilgrimAtlasUI:
    build:
      targets:
        PilgrimAtlas: all
        PilgrimAtlasUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PilgrimAtlasUITests
