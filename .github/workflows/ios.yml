name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          if [[ -d /Applications/Xcode_26.6.app ]]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          elif [[ -d /Applications/Xcode_26.app ]]; then
            sudo xcode-select -s /Applications/Xcode_26.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Pack and copy tests
        run: |
          python3 -m venv .venv
          .venv/bin/pip install pytest shapely numpy pmtiles mapbox-vector-tile
          PYTHONPATH=pipeline .venv/bin/pytest pipeline/tests/test_rules.py pipeline/tests/test_built_pack.py -q

      - name: Archive script self-test
        run: scripts/archive-upload.sh --self-test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml', 'Package.swift', 'Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Unit tests
        id: test
        run: scripts/ios-test.sh

  phone-ui:
    runs-on: macos-26
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          if [[ -d /Applications/Xcode_26.6.app ]]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          elif [[ -d /Applications/Xcode_26.app ]]; then
            sudo xcode-select -s /Applications/Xcode_26.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml', 'Package.swift', 'Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Phone UI tests
        run: scripts/ui-test.sh

      - name: Upload landmark layer screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: landmark-layer-screenshots
          path: build/layer-screenshots
          if-no-files-found: warn

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: build/PilgrimAtlasUITests.xcresult
          if-no-files-found: warn

  testflight:
    needs: [ios, phone-ui]
    if: github.event_name != 'pull_request'
    concurrency:
      group: testflight-${{ github.repository }}
      cancel-in-progress: false
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          if [[ -d /Applications/Xcode_26.6.app ]]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          elif [[ -d /Applications/Xcode_26.app ]]; then
            sudo xcode-select -s /Applications/Xcode_26.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Pack and copy tests
        run: |
          python3 -m venv .venv
          .venv/bin/pip install pytest shapely numpy pmtiles mapbox-vector-tile
          PYTHONPATH=pipeline .venv/bin/pytest pipeline/tests/test_rules.py pipeline/tests/test_built_pack.py -q

      - name: Archive script self-test
        run: scripts/archive-upload.sh --self-test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml', 'Package.swift', 'Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Unit tests
        run: scripts/ios-test.sh

      - name: Archive and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: scripts/archive-upload.sh
